<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقيت هب - الفخامة الطازجة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #6b7a35; 
            --gold-gradient: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }
        body { background: linear-gradient(135deg, #f9fbf7 0%, #eef3e8 100%); font-family: 'Cairo', sans-serif; min-height: 100vh; padding-bottom: 50px; position: relative; }
        .container { max-width: 600px; margin: auto; padding: 20px; text-align: center; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .farmer-anim { font-size: 70px; animation: bounce 3s infinite; }
        .title-fancy { font-family: 'Amiri', serif; font-size: 50px; color: var(--primary); }
        .slogan { font-size: 16px; color: #777; margin-bottom: 20px; }

        /* تعديل شبكة المنتجات */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        /* الحافة الذهبية المتحركة حول المربع */
        .product-box { 
            position: relative;
            background: white; 
            padding: 15px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 700; 
            transition: 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* الطبقة الخارجية لتأثير الحركة الذهبية الدائرية */
        .product-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, #bf953f, #fcf6ba, #b38728, transparent);
            animation: rotateGold 4s linear infinite;
            z-index: 1;
        }

        /* الطبقة الداخلية البيضاء للحفاظ على خلفية المنتج ونظافته */
        .product-box-content {
            position: relative;
            background: white;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 2;
        }

        .product-box img { width: 100%; height: 120px; object-fit: contain; display: block; margin: 0 auto 10px; border-radius: 10px; }
        .product-box:active { transform: scale(0.95); }
        
        /* حركة الدوران الذهبية */
        @keyframes rotateGold {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* زر إتمام الطلب المطور تحت المنتج */
        .btn-order-now {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: linear-gradient(135deg, #8a6f48 0%, #4a3b2c 100%);
            color: #fbf5b7;
            border: 1px solid #bf953f;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            width: 85%;
            text-decoration: none;
        }
        .btn-order-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(191, 149, 63, 0.4);
            background: linear-gradient(135deg, #aa771c 0%, #684a12 100%);
        }
        
        .counter { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .btn-count { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 20px; cursor: pointer; }
        .num-display { font-size: 24px; font-weight: bold; width: 50px; }
        
        .option { padding: 12px; border-radius: 15px; border: 2px solid transparent; background: #fff; margin: 5px; cursor: pointer; display: inline-block; transition: 0.3s; }
        .option.selected { border-color: var(--primary); background: #f0f5e8; transform: scale(1.05); }

        .btn-pay { background: var(--primary); color: white; width: 100%; padding: 18px; border-radius: 50px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        /* أيقونة الواتساب العائمة والمتحركة */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transition: all 0.3s ease-in-out;
            animation: floatUpDown 3s ease-in-out infinite;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }
        .whatsapp-float svg {
            width: 35px;
            height: 35px;
            fill: white;
        }
        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="grid-view">
        <div class="farmer-anim">👨‍🌾</div>
        <div class="title-fancy">بقيت هب</div>
        <div class="slogan">من أرضنا الطيبة.. إلى مائدتكم مباشرة 🌿</div>
        <div class="grid">
            <script>
                const prods = [
                    {n: "طماطم 🍅", i: "https://b.top4top.io/p_3808afug70.jpeg"},
                    {n: "جزر 🥕", i: "https://c.top4top.io/p_3808n0r6h1.jpeg"},
                    {n: "بصل 🧅", i: "https://d.top4top.io/p_3808rtuwr4.jpeg"},
                    {n: "كوسة 🥒", i: "https://e.top4top.io/p_3808bn76y5.jpeg"},
                    {n: "خس 🥬", i: "https://f.top4top.io/p_38085nrsi8.jpeg"},
                    {n: "ست كامل زيتي 🫒 (36 KD)", i: "https://c.top4top.io/p_38472cpa50.jpeg"}
                ];
                prods.forEach(p => {
                    document.write(`
                        <div class="product-box" onclick="goDetails('${p.n}')">
                            <div class="product-box-content">
                                <img src="${p.i}" alt="${p.n}">
                                <span>${p.n}</span>
                                <div class="btn-order-now">إتمام الطلب ✨</div>
                            </div>
                        </div>
                    `);
                });
            </script>
        </div>
    </div>

    <div id="details-view" style="display:none;">
        <h2 id="prod-title" style="color: var(--primary);"></h2>
        <p>العدد:</p>
        <div class="counter">
            <button class="btn-count" onclick="changeCount(-1)">-</button>
            <div class="num-display" id="count">1</div>
            <button class="btn-count" onclick="changeCount(1)">+</button>
        </div>
        <p>اختر الحجم:</p>
        <div id="size-options">
            <span class="option" onclick="select(this, 'size')">صغير 🤏</span>
            <span class="option" onclick="select(this, 'size')">وسط ⚖️</span>
            <span class="option" onclick="select(this, 'size')">كبير 📦</span>
        </div>
        <p style="margin-top:20px;">طريقة الدفع:</p>
        <div id="pay-options">
            <span class="option" onclick="select(this, 'pay')">الدفع عند الاستلام 💵</span>
            <span class="option" onclick="select(this, 'pay')">مدى ⚡️</span>
            <span class="option" onclick="select(this, 'pay')">لينك 🔗</span>
        </div>
        <button class="btn-pay" onclick="sendWhatsApp()">إتمام الدفع عبر واتساب 📲</button>
        <button onclick="goBack()" style="background:none; border:none; margin-top:20px; color:#aaa; text-decoration:underline;">العودة</button>
    </div>
</div>

<!-- أيقونة الواتساب العائمة -->
<a href="https://wa.me/96598523539?text=مرحباً%20بكم%20في%20خدمة%20عملاء%20بقيت%20هب%20🌿" class="whatsapp-float" target="_blank" aria-label="اتصل بنا عبر واتساب">
    <svg viewBox="0 0 448 512">
        <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
    </svg>
</a>

<script>
    let currentProd = "", count = 1;
    function changeCount(val) { count = Math.max(1, Math.min(200, count + val)); document.getElementById('count').innerText = count; }
    function select(el, group) {
        el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
    }
    function goDetails(name) {
        currentProd = name;
        document.getElementById('grid-view').style.display = 'none';
        document.getElementById('prod-title').innerText = name;
        document.getElementById('details-view').style.display = 'block';
    }
    function goBack() { document.getElementById('details-view').style.display = 'none'; document.getElementById('grid-view').style.display = 'block'; }
    function sendWhatsApp() {
        let size = document.querySelector('#size-options .selected')?.innerText || "لم يتم اختيار الحجم";
        let pay = document.querySelector('#pay-options .selected')?.innerText || "لم يتم اختيار طريقة الدفع";
        let msg = `✨ طلب جديد من بقيت هب ✨%0A%0A📦 المنتج: ${currentProd}%0A🔢 العدد: ${count}%0A📏 الحجم: ${size}%0A💳 طريقة الدفع: ${pay}%0A%0Aبانتظار تأكيد طلبكم.. 🌿`;
        window.location.href = "https://wa.me/96598523539?text=" + msg;
    }
</script>

</body>
</html>
