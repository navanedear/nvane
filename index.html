
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NVANE | Luxury Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-dark: #261c14; 
            --gold-primary: #b89a6c;
            --gold-light: #ebdcc5;
            --whatsapp-green: #25D366;
            --bg-cream: #fbf9f6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: var(--brand-dark);
            overflow-x: hidden;
        }

        /* --- شاشة الترحيب الناعمة والأنيقة --- */
        #landing-screen {
            height: 100vh; width: 100%;
            background-color: var(--brand-dark);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 5000;
            transition: transform 1s cubic-bezier(0.86, 0, 0.07, 1);
        }
        
        .deer-svg {
            width: 75px; height: 75px; fill: none; stroke: var(--gold-primary); stroke-width: 1.2; margin-bottom: 8px;
        }

        #landing-screen .logo-big { 
            font-family: 'Cormorant Garamond', serif; color: var(--gold-primary); font-size: 48px; letter-spacing: 16px; text-transform: uppercase; margin-left: -16px; font-weight: 400;
        }

        .blazers-subtext {
            color: var(--gold-primary); font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 10px; text-transform: uppercase; margin-top: 8px; opacity: 0.9;
        }

        .explore-btn { 
            background: none; border: 1px solid var(--gold-primary); color: var(--gold-primary); padding: 14px 45px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; margin-top: 55px;
        }

        /* --- الهيدر (ثابت فوق بالقمة ولا ينزل مع السكرول + حجم صغير حيل) --- */
        header { 
            background-color: var(--brand-dark); 
            padding: 14px 20px 12px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: absolute; 
            top: 0; 
            left: 0;
            width: 100%;
            z-index: 1000; 
        }
        .header-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 180px; 
        }
        .header-wrap .logo { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 26px; 
            font-weight: 300; 
            color: var(--gold-light); 
            letter-spacing: 5px; 
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 5px;
            margin-left: -5px; 
        }
        .logo-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            margin-bottom: 4px;
        }
        .logo-divider::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 0.5px;
            background-color: rgba(235, 220, 197, 0.25);
        }
        .logo-divider .sparkle {
            color: var(--gold-light);
            font-size: 7px; 
            background-color: var(--brand-dark);
            padding: 0 6px;
            position: relative;
            z-index: 2;
            line-height: 1;
        }
        .header-wrap .sub-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 6px; 
            font-weight: 400;
            color: rgba(235, 220, 197, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-left: -3px;
        }

        /* --- حاوية الهيكل العام للموقع --- */
        .main-layout {
            max-width: 1400px; margin: 90px auto 40px; padding: 0 25px;
            display: flex; flex-direction: column; gap: 30px;
        }

        /* --- البانر الإعلاني الكرت --- */
        .hero-banner-wrapper { width: 100%; }
        .hero-banner {
            background: #ffffff; 
            border: 1px solid #eae1d4; 
            border-radius: 4px; 
            padding: 45px 20px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(184,154,108,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .badge-box {
            border: 1.5px solid var(--gold-primary);
            border-radius: 50px;
            padding: 14px 40px; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 18px;
            max-width: 95%;
        }
        .badge-box h2 { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 21px; 
            color: var(--gold-primary); 
            font-weight: 500; 
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
        }
        .badge-box .inner-sparkle {
            color: var(--gold-primary);
            font-size: 11px;
            opacity: 0.8;
        }
        .hero-banner p { font-size: 13px; color: #7a7065; letter-spacing: 0.5px; line-height: 1.5; font-weight: 500; max-width: 340px; margin-top: 5px; }

        /* حاوية المنتجات بالمنتصف */
        .products-wrapper { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 25px; width: 100%;
        }
        @media (max-width: 768px) {
            .products-wrapper { display: flex; flex-direction: column; gap: 0; }
        }

        /* تصميم بطاقات المنتجات */
        .product-card { 
            background: #ffffff; border: 1px solid #eee6dc; border-radius: 6px; padding: 14px; cursor: pointer; transition: 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 25px; width: 100%;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(184,154,108,0.12); }
        
        .img-container { width: 100%; height: 320px; overflow: hidden; border-radius: 4px; margin-bottom: 12px; background: var(--bg-cream); }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-meta { text-align: right; }
        .product-meta h3 { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: var(--brand-dark); }
        .product-meta .desc { font-size: 11px; color: #8a7e72; margin-bottom: 8px; }
        .product-meta .price { font-weight: 700; font-size: 14px; color: var(--brand-dark); margin-bottom: 12px; }

        .card-btn { display: block; width: 100%; background: var(--brand-dark); color: var(--gold-light); text-align: center; padding: 10px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; font-weight: 700; }

        /* خانات قريباً بالأسفل */
        .coming-soon-wrapper { width: 100%; margin-top: 5px; }
        .coming-soon-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 768px) { .coming-soon-grid { grid-template-columns: 1fr; gap: 10px; } }
        
        .soon-box { 
            background: #ffffff; border: 1px solid #ebdcc5; border-radius: 6px; height: 75px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.01); 
        }
        .soon-box .soon-text { color: var(--brand-dark); font-size: 11.5px; font-weight: 600; line-height: 1.4; }

        /* --- صفحة تفاصيل المنتج وسلايدر الصور --- */
        #pdp-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 6000; overflow-y: auto; transform: translateY(100%); transition: transform 0.5s ease;
        }
        #pdp-screen.active { transform: translateY(0); }
        .pdp-header { padding: 45px 25px 15px; display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: auto; }
        
        .slider-wrapper { position: relative; width: 100%; max-width: 500px; margin: 0 auto; padding: 0 20px; overflow: hidden; }
        .pdp-slider { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .pdp-slider::-webkit-scrollbar { display: none; }
        .pdp-slider img { width: 100%; flex-shrink: 0; scroll-snap-align: start; border-radius: 4px; object-fit: cover; }
        
        .slider-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; margin-bottom: 15px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #eee; transition: 0.3s; }
        .dot.active { background: var(--gold-primary); width: 18px; border-radius: 4px; }
        
        .pdp-container { max-width: 500px; margin: auto; padding: 25px; text-align: right; }
        .pdp-title-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 5px; }
        .pdp-title-row h1 { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; }
        .pdp-subtitle { font-size: 12px; color: #999; margin-bottom: 12px; }
        .pdp-price { font-size: 20px; font-weight: 700; margin-bottom: 25px; color: var(--brand-dark); }

        .section-label { font-size: 11px; color: #bbb; text-transform: uppercase; margin-bottom: 12px; display: block; letter-spacing: 1px; }
        .size-selector { display: flex; flex-direction: row-reverse; gap: 10px; margin-bottom: 30px; }
        .size-box { width: 46px; height: 46px; border: 1.5px solid #eee; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .size-box.active { border-color: var(--brand-dark); background: var(--brand-dark); color: #fff; }

        .order-wa-button { display: block; width: 100%; background: var(--brand-dark); color: var(--gold-light); text-align: center; text-decoration: none; padding: 18px; border-radius: 50px; font-weight: 700; font-size: 13px; letter-spacing: 2px; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }

        .payment-label { font-size: 10px; color: #ccc; text-transform: uppercase; margin-bottom: 15px; display: block; }
        .pay-option { display: flex; align-items: center; justify-content: space-between; padding: 16px; border: 1.5px solid #eee; border-radius: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .pay-option.active { border-color: var(--brand-dark); background: #fff; }
        .pay-option .check-icon { width: 22px; height: 22px; border: 1.5px solid #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; }
        .pay-option.active .check-icon { background: #2ecc71; border-color: #2ecc71; color: white; }
        .pay-info { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 14px; }

        .wa-float { position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px; background: var(--whatsapp-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 4000; text-decoration: none; }
        footer { text-align: center; padding: 30px; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 2px; border-top: 1px solid #eee; margin-top: 40px; }
    </style>
</head>
<body>

<div id="landing-screen">
    <svg class="deer-svg" viewBox="0 0 100 100">
        <path d="M50 35 L50 45 M50 35 C40 20 30 25 25 35 M50 35 C60 20 70 25 75 35" stroke-width="2"/>
        <path d="M40 45 L60 45 L55 75 L45 75 Z" fill="none" stroke-width="2.5"/>
    </svg>
    <div class="logo-big">NVANE</div>
    <div class="blazers-subtext">Blazers</div>
    <button class="explore-btn" onclick="enterStore()">Explore Collection</button>
</div>

<header>
    <div class="header-wrap">
        <div class="logo">NVANE</div>
        <div class="logo-divider">
            <div class="sparkle">✦</div>
        </div>
