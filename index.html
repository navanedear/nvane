<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVANE</title>

<style>

body{
    margin:0;
    font-family: Arial;
    background:#fff;
}

/* المنتج */
.product-card{
    width:100%;
    max-width:400px;
    margin:20px auto;
    cursor:pointer;
}

.img-container img{
    width:100%;
    border-radius:15px;
}

/* PDP */
#pdp{
    position:fixed;
    inset:0;
    background:#fff;
    display:none;
    flex-direction:column;
    z-index:9999;
}

#pdp.active{display:flex;}

/* السلايدر */
.slider{
    position:relative;
    overflow:hidden;
}

.track{
    display:flex;
    transition:0.3s ease;
}

.track img{
    min-width:100%;
    height:450px;
    object-fit:cover;
}

/* النقاط */
.dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:10px;
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ccc;
    cursor:pointer; /* تم تغيير المؤشر ليظهر أنه قابل للضغط */
}

.dot.active{
    background:#000;
}

/* زر رجوع */
.back{
    padding:15px;
    font-size:18px;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- المنتج -->
<div class="product-card" onclick="openPDP()">
    <div class="img-container">
        <img src="https://k.top4top.io/p_37889850m2.jpeg">
    </div>
    <h3>Butter Yellow</h3>
    <p>KD 46</p>
</div>

<!-- صفحة المنتج -->
<div id="pdp">

    <div class="back" onclick="closePDP()">← رجوع</div>

    <div class="slider">

        <div class="track" id="track">

            <img src="https://k.top4top.io/p_37889850m2.jpeg">
            <img src="https://b.top4top.io/p_37888f15g0.jpeg">

        </div>

    </div>

    <div class="dots">
        <!-- تم إضافة onclick هنا لربط النقاط بالدالة مباشرة -->
        <div class="dot active" onclick="go(0)"></div>
        <div class="dot" onclick="go(1)"></div>
    </div>

</div>

<script>

let index = 0;

function openPDP(){
    document.getElementById("pdp").classList.add("active");
}

function closePDP(){
    document.getElementById("pdp").classList.remove("active");
}

const track = document.getElementById("track");
const dots = document.querySelectorAll(".dot");

function go(i){
    index = i;
    // تم تغيير الإشارة إلى موجبة لتتوافق مع اتجاه RTL
    track.style.transform = `translateX(${i * 100}%)`;

    dots.forEach(d=>d.classList.remove("active"));
    dots[i].classList.add("active");
}

/* حساب السحب مع مراعاة اتجاه RTL */
let startX = 0;

track.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
});

track.addEventListener("touchend", e=>{
    let endX = e.changedTouches[0].clientX;

    // السحب لليسار (الانتقال للصورة التالية في الـ RTL)
    if(startX > endX + 50 && index < 1){
        go(index + 1);
    }

    // السحب لليمين (العودة للصورة السابقة في الـ RTL)
    if(startX < endX - 50 && index > 0){
        go(index - 1);
    }
});

</script>

</body>
</html>
