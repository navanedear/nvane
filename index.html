<!DOCTYPE html>

    <style>
        /* إعدادات الخطوط والألوان العامة للبراند */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Arial, sans-serif;
        }

        body {
            background-color: #faf6f0; /* لون البوتيك الناعم */
            color: #4a3e3d;
            padding: 20px 10px;
        }

        /* حاوية المنتج الرئيسية المقسمة لخانة أولى وثانية */
        .product-container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e6dacb;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 30px;
        }

        /* الخانة الأولى: قسم صور المنتج (تصغير ذكي يمنع النزول لأسفل) */
        .product-images-section {
            flex: 1;
            max-height: 480px; /* حد أقصى للطول عشان يرفع الخيارات فوق */
            background-color: #fdfbf7;
            border-radius: 8px;
            border: 1px solid #f2eaec;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .product-images-section img {
            width: 100%;
            height: 100%;
            max-height: 480px;
            object-fit: contain; /* يحافظ على أبعاد البليزر/العباية ويصغرها بأناقة */
        }

        /* الخانة الثانية: تفاصيل المنتج والخيارات الملمومة */
        .product-details-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 5px;
        }

        /* براند البوتيك */
        .brand-name {
            font-size: 0.9rem;
            color: #9e8675;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* اسم المنتج والسعر ملمومين بفراغ بسيط جداً */
        .product-title {
            font-size: 1.6rem;
            color: #5c4d44;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .product-price {
            font-size: 1.3rem;
            color: #6e5d53;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* وصف المنتج */
        .product-description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #7a6e67;
            margin-bottom: 15px;
        }

        /* خيارات المقاس المرفوعة فوق */
        .product-options {
            margin-bottom: 15px;
            background: #faf6f0;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e6dacb;
        }

        .options-label {
            font-size: 0.95rem;
            font-weight: bold;
            color: #5c4d44;
            margin-bottom: 8px;
            display: block;
        }

        .size-selector {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            border: 1px solid #d4c3b3;
            border-radius: 6px;
            background-color: #ffffff;
            color: #4a3e3d;
            outline: none;
            cursor: pointer;
        }

        /* أزرار الطلب والدفع السريع المباشرة */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .buy-now-btn {
            background-color: #6e5d53; /* البني الفاتح المعتمد */
            color: #faf6f0;
        }

        .buy-now-btn:hover {
            background-color: #5c4d44;
        }

        .whatsapp-order-btn {
            background-color: #ffffff;
            color: #25d366;
            border: 1px solid #25d366;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .whatsapp-order-btn:hover {
            background-color: #f0fff5;
        }

        /* دعم التجاوب مع شاشات الموبايل */
        @media (max-width: 768px) {
            .product-container {
                flex-direction: column; /* تحويل الخانات فوق بعض بالموبايل */
                padding: 15px;
                gap: 15px;
            }

            .product-images-section {
                max-height: 320px; /* تصغير إضافي للموبايل لرفع المقاسات فوراً بالشاشة */
            }

            .product-images-section img {
                max-height: 320px;
            }

            .product-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
